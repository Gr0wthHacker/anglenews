<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AngleCheck Icon Generator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; }
  .icon-row { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 8px; }
  .icon-row canvas { border: 1px solid #d1d5db; }
  a { color: #3B82F6; }
  h1 { color: #1e3a5f; }
</style>
</head>
<body>
<h1>AngleCheck Icon Generator</h1>
<p>Click the download links to save each PNG icon.</p>
<div id="icons"></div>
<script>
const sizes = [16, 48, 128];
const container = document.getElementById('icons');

function drawIcon(ctx, size) {
  const r = Math.round(size * 0.125);

  // Rounded rectangle background
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#3B82F6';
  ctx.fill();

  // Angle bracket chevron
  const margin = size * 0.2;
  const cx = size * 0.55;
  const cy = size * 0.5;
  const armLen = size * 0.3;

  ctx.beginPath();
  ctx.moveTo(cx + armLen * 0.4, cy - armLen);
  ctx.lineTo(cx - armLen * 0.5, cy);
  ctx.lineTo(cx + armLen * 0.4, cy + armLen);
  ctx.strokeStyle = 'white';
  ctx.lineWidth = Math.max(2, size * 0.09);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

sizes.forEach(size => {
  const row = document.createElement('div');
  row.className = 'icon-row';

  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size);

  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.textContent = `Download icon-${size}.png`;

  const label = document.createElement('span');
  label.textContent = `${size}x${size}`;

  row.appendChild(canvas);
  row.appendChild(label);
  row.appendChild(link);
  container.appendChild(row);
});
</script>
</body>
</html>
